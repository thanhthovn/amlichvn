<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Âm Lịch Việt Nam</title>
  <meta name="description" content="Lịch âm dương Việt Nam - xem lịch tháng, đổi ngày dương sang âm và âm sang dương.">
  <style>
:root {
  --green-900: #5b2418;
  --green-800: #7a321f;
  --green-700: #a65a22;
  --green-100: #fff4d6;
  --red: #c62828;
  --red-dark: #9d1c1c;
  --cream: #fff8e7;
  --text: #3b241b;
  --muted: #765d50;
  --line: #ead8bd;
  --white: #ffffff;
  --shadow: 0 14px 40px rgba(156, 61, 28, .12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: #fff4df;
}

button, input { font: inherit; }

.topbar {
  background: linear-gradient(135deg, #a91414 0%, #c62828 55%, #9d1c1c 100%);
  color: #ffd76a;
  padding: 18px 20px;
  box-shadow: 0 3px 18px rgba(0,0,0,.12);
}

.topbar {
  position: relative;
  overflow: hidden;
}

.topbar::after {
  content: "✿  ✿  ✿";
  position: absolute;
  right: 22px;
  top: 8px;
  color: rgba(255, 215, 106, .55);
  font-size: 28px;
  letter-spacing: 10px;
  pointer-events: none;
}

.brand {
  max-width: 1080px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 13px;
}

.brand-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: rgba(255,215,100,.18);
  font-size: 27px;
}

.brand h1 { margin: 0; font-size: 21px; }
.brand p { margin: 3px 0 0; opacity: .72; font-size: 13px; }

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 18px 50px;
}

.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 20px;
}

.eyebrow {
  color: var(--red);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 1.5px;
}

.hero h2, .section-heading h2, .info-card h2 {
  margin: 5px 0;
  color: var(--red-dark);
}

.hero h2 { font-size: 29px; }
.hero p { margin: 5px 0; color: #765d50; }

.today-btn, .primary-btn {
  border: 0;
  border-radius: 11px;
  padding: 11px 18px;
  color: white;
  background: var(--red);
  cursor: pointer;
  font-weight: 700;
  transition: .2s;
}

.today-btn:hover, .primary-btn:hover {
  background: var(--red-dark);
  transform: translateY(-1px);
}

.calendar-card, .converter-card, .info-card {
  background: #fffaf0;
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  overflow: hidden;
}

.converter-card {
  background: #fff0d2;
}

.calendar-toolbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 16px 18px;
  background: linear-gradient(135deg, #a91414 0%, #c62828 60%, #9d1c1c 100%);
  color: #fff8df;
}

.nav-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-group:last-child {
  justify-content: flex-end;
}

.nav-btn {
  width: 42px;
  height: 42px;
  border: 2px solid #f6d365;
  background: #fff8e7;
  color: #8b1e1e;
  border-radius: 10px;
  cursor: pointer;
  font-size: 30px;
  font-weight: 900;
  line-height: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
  transition: .2s;
}

.nav-btn:hover {
  background: #f6d365;
  color: #7a321f;
  transform: translateY(-1px);
}

.nav-btn.month-nav-btn {
  background: #66a96a !important;
  border-color: #a9d3ac !important;
  color: #ffffff !important;
}

.nav-btn.month-nav-btn:hover {
  background: #4f8f54 !important;
  border-color: #c0e0c2 !important;
  color: #ffffff !important;
}

.month-title { text-align: center; }
.month-title strong { display: block; font-size: 21px; }
.month-title span { opacity: .7; font-size: 12px; }

.day:hover { background: var(--green-100); }
.day.empty { cursor: default; background: #fff0d5; }
.day.empty:hover { background: #fff0d5; }

.solar {
  font-weight: 800;
  font-size: 17px;
  display: block;
}

.lunar {
  margin-top: 6px;
  color: #765d50;
  font-size: 12px;
  display: block;
}

.day.weekend .solar { color: var(--red); }

.day.today {
  background: #fff0df;
  box-shadow: inset 0 0 0 2px var(--red);
}

.day.today .solar { color: var(--red); }

.legend {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  padding: 12px 16px;
  background: #fffaf0;
  color: #765d50;
  font-size: 12px;
  border-top: 1px solid #ead8bd;
}

.legend span { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.solar { background: var(--red); }
.dot.lunar { background: #c58b16; }
.dot.weekend { background: #999; }

.section-heading {
  padding: 22px 22px 10px;
}

.tabs {
  display: flex;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
  gap: 4px;
}

.tab {
  border: 0;
  background: transparent;
  color: #765d50;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 700;
  border-bottom: 3px solid transparent;
}

.tab.active {
  color: #7a321f;
  border-bottom-color: var(--red);
}

.tab-panel { display: none; padding: 20px 22px 24px; }
.tab-panel.active { display: block; }

.form-grid {
  display: grid;
  grid-template-columns: 100px 100px 120px auto;
  gap: 10px;
  align-items: end;
  margin-bottom: 15px;
}

label {
  color: #765d50;
  font-size: 13px;
  font-weight: 700;
}

input[type="number"] {
  width: 100%;
  margin-top: 7px;
  border: 1px solid #d8dfdb;
  border-radius: 10px;
  padding: 11px;
  outline: none;
}

input[type="number"]:focus {
  border-color: var(--green-700);
  box-shadow: 0 0 0 3px rgba(31,106,73,.10);
}

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 16px;
}

.check-row input { accent-color: var(--green-700); }

.result {
  margin-top: 15px;
  min-height: 50px;
  padding: 14px;
  border-radius: 11px;
  background: var(--green-100);
  color: var(--green-900);
  line-height: 1.5;
}

footer {
  text-align: center;
  padding: 20px;
  color: #765d50;
  font-size: 12px;
}

@media (max-width: 700px) {
  .container { padding: 18px 10px 35px; }
  .hero { align-items: flex-start; }
  .hero h2 { font-size: 23px; }
  .today-btn { padding: 9px 12px; }

  .calendar-table .solar { font-size: 15px; }
  .calendar-table .lunar { margin-top: 4px; font-size: 10px; }

  .form-grid {
    grid-template-columns: 90px 90px 105px auto;
    overflow-x: auto;
    padding-bottom: 2px;
  }
}

@media (max-width: 430px) {
  .form-grid {
    grid-template-columns: 80px 80px 100px auto;
  }

  .brand h1 { font-size: 18px; }
  .calendar-toolbar { grid-template-columns: 1fr auto 1fr; padding: 12px 10px; }
  .nav-group { gap: 4px; }
  .nav-btn {
    width: 36px;
    height: 36px;
    font-size: 23px;
    padding: 0;
  }
  .calendar-table th { padding: 9px 2px; }
  .calendar-table td.lunar { font-size: 9px; }
}

.date-search {
  display: grid;
  grid-template-columns: 100px 100px 120px auto;
  gap: 10px;
  padding: 14px 16px 16px;
  background: #fff;
  border-top: 1px solid var(--line);
}

.date-search label {
  color: #765d50;
  font-size: 13px;
  font-weight: 700;
}

.date-search input[type="number"] {
  width: 100%;
  margin-top: 6px;
  border: 1px solid #d8dfdb;
  border-radius: 10px;
  padding: 10px 11px;
  outline: none;
}

.date-search input[type="number"]:focus {
  border-color: var(--green-700);
  box-shadow: 0 0 0 3px rgba(31,106,73,.10);
}

.date-search-actions {
  align-self: end;
  display: flex;
  gap: 8px;
  min-width: 0;
}

.date-search-actions .today-inline-btn {
  flex: 1 1 0;
}

.date-search-actions .date-search-btn {
  flex: 2 1 0;
}

.date-search-btn,
.today-btn {
  border: 0;
  border-radius: 11px;
  padding: 10px 12px;
  height: 42px;
  color: white;
  cursor: pointer;
  font-weight: 700;
  transition: .2s;
}

.date-search-btn {
  background: var(--red);
}

.date-search-btn:hover {
  background: var(--red-dark);
  transform: translateY(-1px);
}

.today-btn {
  background: #2e7d32;
  border: 2px solid #a5d6a7;
  text-transform: uppercase;
}

.today-btn:hover {
  background: #1b5e20;
  border-color: #c8e6c9;
  transform: translateY(-1px);
}

@media (max-width: 700px) {
  .date-search {
    grid-template-columns: 90px 90px 105px;
  }

  .date-search-actions {
    grid-column: 1 / -1;
  }
}

.calendar-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.calendar-table {
  width: 100%;
  border-collapse: collapse;
  border-spacing: 0;
  table-layout: fixed;
  background: #fffaf0;
}

.calendar-table thead th {
  height: 46px;
  padding: 8px 4px;
  background: #b7d9ba;
  border: 1px solid #91bd95;
  color: #245c29;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
}

.calendar-table tbody tr {
  height: 88px;
}

.calendar-table tbody td.day {
  width: 14.2857%;
  height: 88px;
  padding: 8px;
  border: 1px solid var(--line);
  vertical-align: top;
  text-align: left;
  cursor: pointer;
  background: #fff4df;
  transition: background .15s, box-shadow .15s;
}

.calendar-table tbody td.day:hover {
  background: var(--green-100);
}

.calendar-table tbody td.day.empty {
  cursor: default;
  background: #fff0d5;
}

.calendar-table tbody td.day.empty:hover {
  background: #fff0d5;
}

.calendar-table tbody td.day.adjacent-day {
  cursor: default;
  background: rgba(255, 244, 223, .45);
  color: rgba(118, 93, 80, .42);
  opacity: .72;
}

.calendar-table tbody td.day.adjacent-day:hover {
  background: rgba(255, 244, 223, .55);
}

.calendar-table .adjacent-day .solar {
  color: rgba(118, 93, 80, .42);
  font-weight: 700;
}

.calendar-table .adjacent-day .lunar {
  color: rgba(118, 93, 80, .30);
}

.calendar-table .adjacent-day .holiday {
  color: rgba(179, 38, 30, .30);
}

.calendar-table .solar {
  display: block;
  font-size: 18px;
  line-height: 1.2;
  font-weight: 800;
}

.calendar-table .lunar {
  display: block;
  margin-top: 7px;
  color: #765d50;
  font-size: 11px;
  line-height: 1.25;
}

.calendar-table .holiday {
  display: block;
  margin-top: 5px;
  color: #b3261e;
  font-size: 10px;
  line-height: 1.2;
  font-weight: 800;
}

.calendar-table td.weekend .solar {
  color: #c62828;
}

.calendar-table td.saturday .solar {
  color: #2e7d32;
}

.calendar-table td.today {
  background: #fff0f0 !important;
  box-shadow: inset 0 0 0 2px var(--red);
}

.calendar-table td.selected-date {
  background: #fff0c2 !important;
  box-shadow: inset 0 0 0 2px #d59b22;
}

.calendar-table td.selected-date .solar {
  color: #7a321f;
}

@media (max-width: 700px) {
  .calendar-table {
    min-width: 560px;
  }

  .calendar-table tbody tr {
    height: 72px;
  }

  .calendar-table tbody td.day {
    height: 72px;
    padding: 6px;
  }

  .calendar-table thead th {
    height: 38px;
  }

  .calendar-table .solar {
    font-size: 16px;
  }

  .calendar-table .lunar {
    margin-top: 4px;
    font-size: 10px;
  }
}

@media (max-width: 430px) {
  .calendar-table {
    min-width: 520px;
  }

  .calendar-table tbody td.day {
    height: 66px;
  }

  .calendar-table .solar {
    font-size: 15px;
  }

  .calendar-table .lunar {
    font-size: 9px;
  }
}


.result + .result { margin-top: 12px; }

button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(198, 40, 40, .20);
  outline-offset: 2px;
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">☯</div>
      <div>
        <h1>VIETNAMESE LUNAR CALENDAR</h1>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h2 id="todayTitle">Hôm nay</h2>
        <p id="todaySummary">Đang tải...</p>
      </div>
    </section>

    <section class="calendar-card">
      <div class="calendar-toolbar">
        <div class="nav-group">
          <button class="nav-btn year-nav-btn" id="prevYear" aria-label="Năm trước" title="Năm trước">«</button>
          <button class="nav-btn month-nav-btn" id="prevMonth" aria-label="Tháng trước" title="Tháng trước">‹</button>
        </div>
        <div class="month-title">
          <strong id="monthYear">Đang tải lịch...</strong>
          <span id="monthLunarInfo">Lịch âm</span>
        </div>
        <div class="nav-group">
          <button class="nav-btn month-nav-btn" id="nextMonth" aria-label="Tháng sau" title="Tháng sau">›</button>
          <button class="nav-btn year-nav-btn" id="nextYear" aria-label="Năm sau" title="Năm sau">»</button>
        </div>
      </div>

      <div class="date-search">
        <label>
          <input id="searchDay" type="number" inputmode="numeric" min="1" max="31" placeholder="Ngày">
        </label>
        <label>
          <input id="searchMonth" type="number" inputmode="numeric" min="1" max="12" placeholder="Tháng">
        </label>
        <label>
          <input id="searchYear" type="number" inputmode="numeric" min="1200" max="2199" placeholder="Năm">
        </label>
        <div class="date-search-actions">
          <button class="date-search-btn today-inline-btn" id="searchDateBtn">Tìm ngày</button>
          <button class="today-btn today-inline-btn" id="todayBtn">HÔM NAY</button>
        </div>
      </div>

      <div class="calendar-wrap">
        <table class="calendar-table">
          <thead>
            <tr>
              <th>T2</th>
              <th>T3</th>
              <th>T4</th>
              <th>T5</th>
              <th>T6</th>
              <th>T7</th>
              <th>CN</th>
            </tr>
          </thead>
          <tbody id="calendarGrid"></tbody>
        </table>
      </div>
      <div class="legend">
        <span><i class="dot solar"></i> Hôm nay</span>
        <span><i class="dot lunar"></i> Ngày âm</span>
        <span><i class="dot weekend"></i> Cuối tuần</span>
      </div>

    </section>

    <section class="converter-card">
      <div class="section-heading">
        <div>
          <span class="eyebrow">CÔNG CỤ CHUYỂN ĐỔI LỊCH ÂM-DƯƠNG</span>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="solarToLunar">Dương Lịch → Âm Lịch</button>
        <button class="tab" data-tab="lunarToSolar">Âm Lịch → Dương Lịch</button>
      </div>

      <div class="tab-panel active" id="solarToLunar">
        <div class="form-grid">
          <label>Ngày
            <input id="solarDay" type="number" inputmode="numeric" min="1" max="31">
          </label>
          <label>Tháng
            <input id="solarMonth" type="number" inputmode="numeric" min="1" max="12">
          </label>
          <label>Năm
            <input id="solarYear" type="number" inputmode="numeric" min="1200" max="2199">
          </label>
          <button class="primary-btn" id="convertSolarBtn">Đổi sang Âm lịch</button>
        </div>
        <div class="result" id="solarResult">Nhập ngày dương rồi bấm chuyển đổi.</div>
      </div>

      <div class="tab-panel" id="lunarToSolar">
        <div class="form-grid">
          <label>Ngày âm
            <input id="lunarDay" type="number" inputmode="numeric" min="1" max="30">
          </label>
          <label>Tháng âm
            <input id="lunarMonth" type="number" inputmode="numeric" min="1" max="12">
          </label>
          <label>Năm âm
            <input id="lunarYear" type="number" inputmode="numeric" min="1200" max="2199">
          </label>
          <button class="primary-btn" id="convertLunarBtn">Đổi sang Dương lịch</button>
        </div>
        <label class="check-row">
          <input id="lunarLeap" type="checkbox">
          <span>Tháng nhuận</span>
        </label>
        <div class="result" id="lunarResult">Nhập ngày âm rồi bấm chuyển đổi.</div>
      </div>
    </section>

  </main>

  <footer>
    <p>© <span id="footerYear">2026</span> Thánh Thơ • amlich of HoNgocDuc</p>
  </footer>

  <script>
/* Âm Lịch Việt Nam - browser version
 * Thuật toán chuyển đổi được chuyển từ thư viện amlich của Ho Ngoc Duc.
 * Múi giờ mặc định: Việt Nam (UTC+7).
 */
(() => {
  "use strict";

  const PI = Math.PI;
  const TIME_ZONE = 7.0;
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  function INT(d) { return Math.floor(d); }

  function jdFromDate(dd, mm, yy) {
    let a = INT((14 - mm) / 12);
    let y = yy + 4800 - a;
    let m = mm + 12 * a - 3;
    let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) -
             INT(y / 100) + INT(y / 400) - 32045;
    if (jd < 2299161) {
      jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
    }
    return jd;
  }

  function jdToDate(jd) {
    let a, b, c, d, e, m;
    if (jd > 2299160) {
      a = jd + 32044;
      b = INT((4 * a + 3) / 146097);
      c = a - INT((b * 146097) / 4);
    } else {
      b = 0;
      c = jd + 32082;
    }
    d = INT((4 * c + 3) / 1461);
    e = c - INT((1461 * d) / 4);
    m = INT((5 * e + 2) / 153);
    const day = e - INT((153 * m + 2) / 5) + 1;
    const month = m + 3 - 12 * INT(m / 10);
    const year = b * 100 + d - 4800 + INT(m / 10);
    return [day, month, year];
  }

  function NewMoon(k) {
    let T = k / 1236.85;
    let T2 = T * T;
    let T3 = T2 * T;
    const dr = PI / 180;
    let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;

    // Công thức Hồ Ngọc Đức: -0.4068*sin(M') + 0.0161*sin(2M').
    // Hai hạng tử phải có dấu khác nhau.
    let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) +
      0.0021 * Math.sin(2 * dr * M);
    C1 -= 0.4068 * Math.sin(Mpr * dr);
    C1 += 0.0161 * Math.sin(2 * Mpr * dr);
    C1 -= 0.0004 * Math.sin(3 * Mpr * dr);
    C1 += 0.0104 * Math.sin(2 * F * dr) - 0.0051 * Math.sin((M + Mpr) * dr);
    C1 -= 0.0074 * Math.sin((M - Mpr) * dr) + 0.0004 * Math.sin((2 * F + M) * dr);
    C1 -= 0.0004 * Math.sin((2 * F - M) * dr) - 0.0006 * Math.sin((2 * F + Mpr) * dr);
    C1 += 0.0010 * Math.sin((2 * F - Mpr) * dr) + 0.0005 * Math.sin((2 * Mpr + M) * dr);
    const deltat = T < -11
      ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3
      : -0.000278 + 0.000265 * T + 0.000262 * T2;
    return Jd1 + C1 - deltat;
  }

  function SunLongitude(jdn) {
    const T = (jdn - 2451545.0) / 36525;
    const T2 = T * T;
    const dr = PI / 180;
    const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
    const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
    DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) +
          0.000290 * Math.sin(dr * 3 * M);
    let L = (L0 + DL) * dr;
    L -= PI * 2 * INT(L / (PI * 2));
    return L;
  }

  function getSunLongitude(dayNumber, timeZone) {
    return INT(SunLongitude(dayNumber - 0.5 - timeZone / 24) / PI * 6);
  }

  function getNewMoonDay(k, timeZone) {
    return INT(NewMoon(k) + 0.5 + timeZone / 24);
  }

  function getLunarMonth11(yy, timeZone) {
    const off = jdFromDate(31, 12, yy) - 2415021;
    const k = INT(off / 29.530588853);
    let nm = getNewMoonDay(k, timeZone);
    const sunLong = getSunLongitude(nm, timeZone);
    if (sunLong >= 9) nm = getNewMoonDay(k - 1, timeZone);
    return nm;
  }

  function getLeapMonthOffset(a11, timeZone) {
    const k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
    let last = 0, i = 1;
    let arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
    do {
      last = arc;
      i++;
      arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
    } while (arc !== last && i < 14);
    return i - 1;
  }

  function convertSolar2Lunar(dd, mm, yy, timeZone = TIME_ZONE) {
    const dayNumber = jdFromDate(dd, mm, yy);
    const k = INT((dayNumber - 2415021.076998695) / 29.530588853);
    let monthStart = getNewMoonDay(k + 1, timeZone);
    if (monthStart > dayNumber) monthStart = getNewMoonDay(k, timeZone);

    let a11 = getLunarMonth11(yy, timeZone);
    let b11 = a11;
    let lunarYear;

    if (a11 >= monthStart) {
      lunarYear = yy;
      a11 = getLunarMonth11(yy - 1, timeZone);
    } else {
      lunarYear = yy + 1;
      b11 = getLunarMonth11(yy + 1, timeZone);
    }

    const lunarDay = dayNumber - monthStart + 1;
    const diff = INT((monthStart - a11) / 29);
    let lunarMonth = diff + 11;
    let lunarLeap = 0;

    if (b11 - a11 > 365) {
      const leapMonthDiff = getLeapMonthOffset(a11, timeZone);
      if (diff >= leapMonthDiff) {
        lunarMonth = diff + 10;
        if (diff === leapMonthDiff) lunarLeap = 1;
      }
    }

    if (lunarMonth > 12) lunarMonth -= 12;
    if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;

    return [lunarDay, lunarMonth, lunarYear, lunarLeap];
  }

  function convertLunar2Solar(lunarDay, lunarMonth, lunarYear, lunarLeap, timeZone = TIME_ZONE) {
    let a11, b11;
    if (lunarMonth < 11) {
      a11 = getLunarMonth11(lunarYear - 1, timeZone);
      b11 = getLunarMonth11(lunarYear, timeZone);
    } else {
      a11 = getLunarMonth11(lunarYear, timeZone);
      b11 = getLunarMonth11(lunarYear + 1, timeZone);
    }

    const k = INT(0.5 + (a11 - 2415021.076998695) / 29.530588853);
    let off = lunarMonth - 11;
    if (off < 0) off += 12;

    if (b11 - a11 > 365) {
      const leapOff = getLeapMonthOffset(a11, timeZone);
      let leapMonth = leapOff - 2;
      if (leapMonth < 0) leapMonth += 12;

      if (lunarLeap !== 0 && lunarMonth !== leapMonth) return [0, 0, 0];
      if (lunarLeap !== 0 || off >= leapOff) off += 1;
    }

    const monthStart = getNewMoonDay(k + off, timeZone);
    return jdToDate(monthStart + lunarDay - 1);
  }

  function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  const CAN = ["Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ", "Canh", "Tân", "Nhâm", "Quý"];
  const CHI = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
  // Ngày lễ Việt Nam.
  const FIXED_HOLIDAYS = {
    "1-1": "Tết Dương lịch (Tết Tây)",
    "9-1": "Ngày truyền thống HSSV Việt Nam",
    "3-2": "Ngày thành lập Đảng Cộng Sản Việt Nam",
    "14-2": "Lễ tình nhân (Valentine Đỏ)",
    "27-2": "Ngày thầy thuốc Việt Nam",
    "8-3": "Ngày Quốc tế Phụ nữ",
    "14-3": "Valentine Trắng",
    "20-3": "Ngày Quốc tế Hạnh phúc",
    "26-3": "Ngày thành lập Đoàn TNCS Hồ Chí Minh",
    "1-4": "Cá tháng Tư",
    "14-4": "Valentine Đen",
    "30-4": "Ngày giải phóng miền Nam",
    "1-5": "Ngày Quốc tế Lao động",
    "7-5": "Ngày chiến thắng Điện Biên Phủ",
    "19-5": "Ngày sinh Chủ tịch Hồ Chí Minh",
    "1-6": "Ngày Quốc tế thiếu nhi",
    "21-6": "Ngày báo chí Việt Nam",
    "28-6": "Ngày gia đình Việt Nam",
    "11-7": "Ngày dân số thế giới",
    "27-7": "Ngày Thương binh liệt sĩ",
    "28-7": "Ngày thành lập công đoàn Việt Nam",
    "19-8": "Ngày kỷ niệm CMT8 thành công",
    "2-9": "Ngày Quốc Khánh",
    "10-9": "Ngày thành lập MTTQ Việt Nam",
    "1-10": "Ngày quốc tế người cao tuổi",
    "10-10": "Ngày giải phóng Thủ đô",
    "13-10": "Ngày Doanh nhân Việt Nam",
    "20-10": "Ngày Phụ nữ Việt Nam",
    "31-10": "Ngày Halloween",
    "9-11": "Ngày pháp luật Việt Nam",
    "19-11": "Ngày Quốc tế Nam giới",
    "20-11": "Ngày Nhà giáo Việt Nam",
    "23-11": "Ngày thành lập Hội chữ thập đỏ Việt Nam",
    "24-11": "Ngày Văn hóa Việt Nam",
    "1-12": "Ngày thế giới phòng chống AIDS",
    "19-12": "Ngày toàn quốc kháng chiến",
    "22-12": "Ngày thành lập QĐND Việt Nam",
    "24-12": "Lễ Giáng sinh"
  };

  const LUNAR_HOLIDAYS = {
    "1-1": "Tết Nguyên đán",
    "2-1": "Tết Nguyên đán",
    "3-1": "Tết Nguyên đán",
    "15-1": "Tết Nguyên Tiêu",
    "10-3": "Giỗ tổ Hùng Vương",
    "15-4": "Lễ Phật Đản",
    "5-5": "Tết Đoan ngọ",
    "7-7": "Lễ Thất tịch",
    "15-7": "Lễ Vu Lan",
    "15-8": "Tết Trung thu",
    "9-9": "Tết Trùng cửu",
    "10-10": "Tết Trùng thập",
    "15-10": "Tết Hạ Nguyên",
    "23-12": "Ông Táo về trời"
  };

  function getNthWeekdayOfMonth(year, month, weekday, nth) {
    // weekday: 0 = Chủ nhật ... 6 = Thứ bảy
    const first = new Date(year, month - 1, 1);
    const offset = (weekday - first.getDay() + 7) % 7;
    return 1 + offset + (nth - 1) * 7;
  }

  function getDynamicHoliday(d, m, y) {
    const holidays = [];

    // Chủ nhật thứ 2 của tháng 5: Ngày của Mẹ.
    if (m === 5 && d === getNthWeekdayOfMonth(y, 5, 0, 2)) {
      holidays.push("Ngày của mẹ");
    }

    // Chủ nhật thứ 3 của tháng 6: Ngày của Cha.
    if (m === 6 && d === getNthWeekdayOfMonth(y, 6, 0, 3)) {
      holidays.push("Ngày của cha");
    }

    return holidays;
  }

  function getHoliday(d, m, lunar, solarYear = new Date().getFullYear()) {
    const holidays = [];
    const fixed = FIXED_HOLIDAYS[`${d}-${m}`];
    const lunarHoliday = lunar[3]
      ? null
      : LUNAR_HOLIDAYS[`${lunar[0]}-${lunar[1]}`];

    if (fixed) holidays.push(fixed);
    if (lunarHoliday) holidays.push(lunarHoliday);
    holidays.push(...getDynamicHoliday(d, m, solarYear));

    return holidays.join(" • ");
  }


  function mod(n, m) {
    return ((n % m) + m) % m;
  }

  function canChiYear(year) {
    return `${CAN[mod(year + 6, 10)]} ${CHI[mod(year + 8, 12)]}`;
  }

  function canChiDay(d, m, y) {
    const jd = jdFromDate(d, m, y);
    return `${CAN[mod(jd + 9, 10)]} ${CHI[mod(jd + 1, 12)]}`;
  }

  function canChiMonth(lunarMonth, lunarYear) {
    // Can tháng Giêng được xác định theo Can của năm:
    // Giáp/Kỷ -> Bính Dần; Ất/Canh -> Mậu Dần;
    // Bính/Tân -> Canh Dần; Đinh/Nhâm -> Nhâm Dần;
    // Mậu/Quý -> Giáp Dần.
    const yearCan = (lunarYear + 6) % 10;
    const firstMonthCan = (yearCan % 5) * 2 + 2;
    const can = CAN[mod(firstMonthCan + lunarMonth - 1, 10)];
    return `${can} ${CHI[mod(lunarMonth + 1, 12)]}`;
  }

  function formatLunar(lunar) {
    return `${lunar[0]}/${lunar[1]}${lunar[3] ? " nhuận" : ""}`;
  }

  function dateFromParts(d, m, y) {
    return makeCalendarDate(y, m, d);
  }

  function validSolar(d, m, y) {
    const dt = dateFromParts(d, m, y);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  }

  // Ngày hiện tại luôn theo múi giờ Việt Nam (UTC+7).
  // Không phụ thuộc múi giờ của máy người dùng.
  function getVietnamToday() {
    const now = new Date();
    const vietnam = new Date(now.getTime() + TIME_ZONE * 60 * 60 * 1000);
    return {
      year: vietnam.getUTCFullYear(),
      month: vietnam.getUTCMonth() + 1,
      day: vietnam.getUTCDate()
    };
  }

  function makeCalendarDate(year, month, day) {
    return new Date(year, month - 1, day);
  }

  const vietnamToday = getVietnamToday();
  let current = makeCalendarDate(vietnamToday.year, vietnamToday.month, 1);
  const todayKey = `${vietnamToday.year}-${vietnamToday.month}-${vietnamToday.day}`;
  let selectedDateKey = null;

  function renderCalendar() {
    const y = current.getFullYear();
    const m = current.getMonth() + 1;

    $("monthYear").textContent = `Tháng ${m} Năm ${y}`;

    const firstDay = makeCalendarDate(y, m, 1);
    const mondayIndex = (firstDay.getDay() + 6) % 7;
    const total = daysInMonth(y, m);
    const tbody = $("calendarGrid");

    tbody.innerHTML = "";

    let row = document.createElement("tr");
    let count = 0;
    let firstLunar = null;

    // Hiển thị những ngày cuối tháng trước ở các ô đầu tuần.
    const prevMonthDate = new Date(y, m - 2, 1);
    const prevYear = prevMonthDate.getFullYear();
    const prevMonth = prevMonthDate.getMonth() + 1;
    const prevTotal = daysInMonth(prevYear, prevMonth);

    for (let i = mondayIndex - 1; i >= 0; i--) {
      const d = prevTotal - i;
      const lunar = convertSolar2Lunar(d, prevMonth, prevYear);
      const holiday = getHoliday(d, prevMonth, lunar, prevYear);
      const td = document.createElement("td");
      td.className = "day adjacent-day";
      td.innerHTML = `
        <span class="solar">${d}</span>
        <span class="lunar">${formatLunar(lunar)}</span>
        ${holiday ? `<span class="holiday">${holiday}</span>` : ""}
      `;
      td.title = `${d}/${prevMonth}/${prevYear} (tháng trước)`;
      row.appendChild(td);
      count++;
    }

    for (let d = 1; d <= total; d++) {
      const lunar = convertSolar2Lunar(d, m, y);
      const holiday = getHoliday(d, m, lunar, y);

      if (!firstLunar) firstLunar = lunar;

      const date = makeCalendarDate(y, m, d);
      const weekday = date.getDay();
      const key = `${y}-${m}-${d}`;

      const td = document.createElement("td");
      td.className = "day";

      if (weekday === 0 || weekday === 6) {
        td.classList.add("weekend");
      }

      if (weekday === 6) {
        td.classList.add("saturday");
      }

      if (key === todayKey) {
        td.classList.add("today");
      }

      if (selectedDateKey && key === selectedDateKey && key !== todayKey) {
        td.classList.add("selected-date");
      }

      td.innerHTML = `
        <span class="solar">${d}</span>
        <span class="lunar">${formatLunar(lunar)}</span>
        ${holiday ? `<span class="holiday">${holiday}</span>` : ""}
      `;

      td.title =
        `${d}/${m}/${y} → ${lunar[0]}/${lunar[1]}/${lunar[2]}` +
        (lunar[3] ? " (tháng nhuận)" : "") +
        (holiday ? ` • ${holiday}` : "");

      td.addEventListener("click", function () {
        selectedDateKey = `${y}-${m}-${d}`;
        renderCalendar();
        showSelectedDate(d, m, y, lunar);
      });

      row.appendChild(td);
      count++;

      if (count === 7) {
        tbody.appendChild(row);
        row = document.createElement("tr");
        count = 0;
      }
    }

    // Hiển thị những ngày đầu tháng sau để đủ 7 cột.
    if (count > 0) {
      const nextMonthDate = new Date(y, m, 1);
      const nextYear = nextMonthDate.getFullYear();
      const nextMonth = nextMonthDate.getMonth() + 1;
      let nextDay = 1;

      while (count < 7) {
        const lunar = convertSolar2Lunar(nextDay, nextMonth, nextYear);
        const holiday = getHoliday(nextDay, nextMonth, lunar, nextYear);
        const td = document.createElement("td");
        td.className = "day adjacent-day";
        td.innerHTML = `
          <span class="solar">${nextDay}</span>
          <span class="lunar">${formatLunar(lunar)}</span>
          ${holiday ? `<span class="holiday">${holiday}</span>` : ""}
        `;
        td.title = `${nextDay}/${nextMonth}/${nextYear} (tháng sau)`;
        row.appendChild(td);
        nextDay++;
        count++;
      }

      tbody.appendChild(row);
    }

    const todayLunar = convertSolar2Lunar(
      vietnamToday.day,
      vietnamToday.month,
      vietnamToday.year
    );

    $("monthLunarInfo").textContent =
      `Tháng ${canChiMonth(todayLunar[1], todayLunar[2])} • Năm ${canChiYear(todayLunar[2])}`;
  }

  function showSelectedDate(d, m, y, lunar) {
    selectedDateKey = `${y}-${m}-${d}`;
    $("todayTitle").textContent = `${pad(d)}-${pad(m)}-${y}`;
    const holiday = getHoliday(d, m, lunar, y);
    $("todaySummary").textContent =
      `[Mùng ${formatLunar(lunar)} ÂL] Ngày ${canChiDay(d, m, y)} • Tháng ${canChiMonth(lunar[1], lunar[2])} • Năm ${canChiYear(lunar[2])}` +
      (holiday ? ` • 🎉 ${holiday}` : "");
  }

  function searchDateClick() {
    const d = Number($("searchDay").value);
    const m = Number($("searchMonth").value);
    const y = Number($("searchYear").value);

    if (
      !Number.isInteger(d) || !Number.isInteger(m) || !Number.isInteger(y) ||
      !validSolar(d, m, y)
    ) {
      alert("Vui lòng nhập ngày, tháng, năm Dương lịch hợp lệ.");
      return;
    }

    selectedDateKey = `${y}-${m}-${d}`;
    current = makeCalendarDate(y, m, 1);
    const lunar = convertSolar2Lunar(d, m, y);

    renderCalendar();
    showSelectedDate(d, m, y, lunar);

    $("calendarGrid").closest(".calendar-card").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function resetToToday() {
    selectedDateKey = null;
    current = makeCalendarDate(vietnamToday.year, vietnamToday.month, 1);
    const lunar = convertSolar2Lunar(vietnamToday.day, vietnamToday.month, vietnamToday.year);
    renderCalendar();
    showSelectedDate(vietnamToday.day, vietnamToday.month, vietnamToday.year, lunar);
  }

  function setDefaultConverterValues() {
    $("searchDay").value = vietnamToday.day;
    $("searchMonth").value = vietnamToday.month;
    $("searchYear").value = vietnamToday.year;

    $("solarDay").value = vietnamToday.day;
    $("solarMonth").value = vietnamToday.month;
    $("solarYear").value = vietnamToday.year;

    const lunar = convertSolar2Lunar(vietnamToday.day, vietnamToday.month, vietnamToday.year);
    $("lunarDay").value = lunar[0];
    $("lunarMonth").value = lunar[1];
    $("lunarYear").value = lunar[2];
    $("lunarLeap").checked = !!lunar[3];
  }

  function convertSolarClick() {
    const d = Number($("solarDay").value);
    const m = Number($("solarMonth").value);
    const y = Number($("solarYear").value);

    if (
      !Number.isInteger(d) || !Number.isInteger(m) || !Number.isInteger(y) ||
      !validSolar(d, m, y)
    ) {
      $("solarResult").textContent = "Ngày Dương lịch không hợp lệ.";
      return;
    }

    const lunar = convertSolar2Lunar(d, m, y);
    $("solarResult").innerHTML =
      `<strong>${pad(d)}/${pad(m)}/${y}</strong> Dương lịch = ` +
      `<strong>${lunar[0]}/${lunar[1]}/${lunar[2]}</strong> Âm lịch` +
      `${lunar[3] ? " (tháng nhuận)" : ""}.<br>` +
      `Can Chi: ${canChiDay(d,m,y)} • Năm ${canChiYear(lunar[2])}.`;
  }

  function convertLunarClick() {
    const d = Number($("lunarDay").value);
    const m = Number($("lunarMonth").value);
    const y = Number($("lunarYear").value);
    const leap = $("lunarLeap").checked ? 1 : 0;

    if (
      !Number.isInteger(d) || !Number.isInteger(m) || !Number.isInteger(y) ||
      d < 1 || d > 30 || m < 1 || m > 12 || y < 1200 || y > 2199
    ) {
      $("lunarResult").textContent = "Ngày Âm lịch không hợp lệ.";
      return;
    }

    const solar = convertLunar2Solar(d, m, y, leap);

    if (solar[0] === 0) {
      $("lunarResult").textContent =
        "Ngày Âm lịch này không tồn tại hoặc lựa chọn tháng nhuận không đúng.";
      return;
    }

    // Kiểm tra ngược để loại các ngày vượt quá số ngày thực tế
    // của tháng âm (ví dụ ngày 30 ở tháng chỉ có 29 ngày).
    const check = convertSolar2Lunar(solar[0], solar[1], solar[2]);
    if (
      check[0] !== d ||
      check[1] !== m ||
      check[2] !== y ||
      !!check[3] !== !!leap
    ) {
      $("lunarResult").textContent =
        "Ngày Âm lịch này không tồn tại hoặc lựa chọn tháng nhuận không đúng.";
      return;
    }

    $("lunarResult").innerHTML =
      `<strong>${pad(d)}/${pad(m)}/${y}${leap ? " (nhuận)" : ""}</strong> Âm lịch = ` +
      `<strong>${pad(solar[0])}/${pad(solar[1])}/${solar[2]}</strong> Dương lịch.`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    $("prevYear").addEventListener("click", () => {
      current = makeCalendarDate(current.getFullYear() - 1, current.getMonth() + 1, 1);
      renderCalendar();
    });

    $("prevMonth").addEventListener("click", () => {
      current = makeCalendarDate(current.getFullYear(), current.getMonth(), 1);
      renderCalendar();
    });

    $("nextMonth").addEventListener("click", () => {
      current = makeCalendarDate(current.getFullYear(), current.getMonth() + 2, 1);
      renderCalendar();
    });

    $("nextYear").addEventListener("click", () => {
      current = makeCalendarDate(current.getFullYear() + 1, current.getMonth() + 1, 1);
      renderCalendar();
    });

    $("todayBtn").addEventListener("click", resetToToday);
    $("searchDateBtn").addEventListener("click", searchDateClick);
    ["searchDay", "searchMonth", "searchYear"].forEach(id => {
      $(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") searchDateClick();
      });
    });
    $("convertSolarBtn").addEventListener("click", convertSolarClick);
    $("convertLunarBtn").addEventListener("click", convertLunarClick);

    ["solarDay", "solarMonth", "solarYear"].forEach(id => {
      $(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") convertSolarClick();
      });
    });

    ["lunarDay", "lunarMonth", "lunarYear"].forEach(id => {
      $(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") convertLunarClick();
      });
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        $(tab.dataset.tab).classList.add("active");
      });
    });

    setDefaultConverterValues();
    $("footerYear").textContent = new Date().getFullYear();
    resetToToday();
  });

  // Expose the conversion functions for console/debugging if needed.
  window.AmLich = { convertSolar2Lunar, convertLunar2Solar, jdFromDate, jdToDate };
})();

</script>
